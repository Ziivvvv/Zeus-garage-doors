<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Per-page meta (title, description, canonical, OG, Twitter, robots, geo, schema)
    are injected per-route by the prerender build step via src/prerender.tsx.
    SEOHead.tsx handles them client-side during hydration / SPA navigation.
    DO NOT add duplicate per-page meta here — it will conflict with prerendered output.
  -->

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/zeus-logo-navbar.png" />

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZWPXM7LWRV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZWPXM7LWRV');
  </script>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts: Playfair Display + DM Sans — preload critical -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Theme color (mobile browser chrome) -->
  <meta name="theme-color" content="#1B2A3B" />

  <!-- Critical CSS: font-face variables for CLS prevention -->
  <style>
    :root {
      --color-navy: #1B2A3B;
      --color-gold: #C9A84C;
      --color-offwhite: #F9F7F4;
      --color-charcoal: #2D2D2D;
      --color-green: #2D6A4F;
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }

    body {
      font-family: var(--font-body);
      font-size: 17px;
      color: var(--color-charcoal);
      background-color: var(--color-offwhite);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-bottom: 0;
    }

    .font-playfair {
      font-family: var(--font-heading);
    }

    @media (max-width: 1024px) {
      body {
        padding-bottom: 72px;
      }
    }

    #root {
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    #root.loaded {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        document.getElementById('root').classList.add('loaded');
      }, 50);
    });
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
